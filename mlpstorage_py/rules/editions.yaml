# Rules editions and declared comparability classes.
#
# This file is the machine-readable companion of Rules.md "Rules editions and
# comparability classes". It is DATA, edited by the working group through a
# pull request; the tool only reads it (mlpstorage_py/editions.py).
#
# editions:  one entry per rules edition (the `rules_edition` every run leaf's
#            provenance.json and every submission.yaml declares). An edition
#            bumps only when a workload's numbers or validity change, or a
#            workload is added or retired -- never for a tool release.
#            `current_edition` must equal config.RULES_EDITION (tested).
#            `checker:` carries the parameters `validate` needs to check a
#            submission of that edition: the required files and folders of
#            every datagen / run / checkpoint leaf, the Rules.md 3.3.2 AU
#            minimum per training model, the Table 2 CLOSED process counts
#            and checkpoint sizes, the Table 3 simulated-accelerator memory
#            and the 6.3.2.1 KVCache sequence locks. Only an edition THIS tool
#            can check carries one; an edition without it is checked by the
#            tool its `tool:` line names, and a submission.yaml declaring it
#            fails EDN-04. The current edition must carry one (tested). The
#            `mlpstorage` runtime reads the current edition's block for the
#            same values (CLI choices, pre-flight gates, CLOSED defaults).
#
# classes:   the comparability classes. A class is the WG's assertion that runs
#            of one (division, family, model, emulated accelerator) whose
#            core-config-v1 hash is one of `core_configs` executed the same
#            workload in every edition listed under `editions`. Rows in one
#            class compare; nothing else does. Comparisons across divisions are
#            never declared (WG decision 2026-09-19): a class belongs to exactly
#            one division, and an OPEN run that happens to use a CLOSED
#            configuration stays outside the CLOSED class. Several hashes in one class declare several spellings of
#            one workload equivalent (v1.0 `dataset.record_length` vs v2.0
#            `dataset.record_length_bytes`; a future allowlist `@rev` bump).
#            `accelerator: any` matches every accelerator, including a leaf that
#            carries none. It is used only for checkpointing classes of editions
#            3.0 and earlier, whose checkpoint rows recorded no accelerator at
#            all (v3.0 results.csv: Accelerator Type is empty for every
#            checkpoint row). From edition 4.0 on, checkpoint classes are per
#            accelerator: b200 and mi355 checkpoint rows do not compare.
#            `reference` names the shipped workload template that hashes to the
#            class today (regression-tested); it is documentation, not the key.
#            Ids are labels (`<model>-<accelerator>-<letter>`), not ranks.
#
# DLIO revisions and client storage libraries are deliberately NOT part of the
# class key for editions 3.0 and earlier: v3.0 alone ran ten DLIO commits and
# three s3dlio releases across sanctioned CLOSED rows. They are recorded per
# edition as accepted lists; `validate` rule EDN-03 warns about a run on a
# revision the list does not carry. From edition 4.0 on the WG may bring the
# DLIO revision into the class key (decision deferred 2026-09-19).
#
# Seeded 2026-09-19 from the frozen trees (design + survey:
# .planning/rules-editions-and-comparability-classes.md).
schema: mlps-rules-editions/1
current_edition: "3.0"

editions:
  "0.5":
    status: historical
    results_repo: https://github.com/mlcommons/storage_results_v0.5
    tool: none (per-benchmark scripts + DLIO copies)
    layout_versions: []
    workloads:
      closed:
        training:
          unet3d: []
          bert: []
    dlio_revisions: []
    storage_libraries: {}
    notes: >-
      No run leaf carries a DLIO config.yaml, so no class can be seeded; the
      archive importer will re-derive rows from summary.json only.

  "1.0":
    status: historical
    results_repo: https://github.com/mlcommons/storage_results_v1.0
    tool: none (mlperf_storage v1.0 shell wrapper over DLIO 2.0.0)
    layout_versions: []
    workloads:
      closed:
        training:
          unet3d: [a100, h100]
          resnet50: [a100, h100]
          cosmoflow: [a100, h100]
    dlio_revisions: []
    storage_libraries: {}
    notes: >-
      DLIO 2.0.0 copied into each submission (no git revision recorded).
      Configs spell dataset.record_length / record_length_stdev /
      record_length_resize and checkpoint.model_size; v2.0 renamed them (see
      the two-hash classes below).

  "2.0":
    status: historical
    results_repo: https://github.com/mlcommons/submissions_storage_v2.0
    tool: mlpstorage 2.0.x (2.0.0b1)
    layout_versions: [1]
    workloads:
      closed:
        training:
          unet3d: [a100, h100]
          resnet50: [a100, h100]
          cosmoflow: [a100, h100]
        checkpointing:
          llama3-8b: [a100, h100]
          llama3-70b: [a100, h100]
          llama3-405b: [a100, h100]
          llama3-1t: [a100, h100]
    dlio_revisions: []
    storage_libraries: {}
    notes: >-
      DLIO pinned by tag mlperf_storage_v2.0 of the dlio_benchmark repository
      (pyproject: dlio-benchmark @ git+...dlio_benchmark.git@mlperf_storage_v2.0);
      the tag's commit is not recorded in any leaf, so no revision is listed.
      CLOSED checkpointing ran checkpoint.mode=subset with model.parallelism.data
      (8 for 70b, 2 for 405b/1t); OPEN ANL runs used the full configuration.
      No checker block: the 3.0.x tool never read a v2.0 tree (its leaf layout
      differs from every 3.0 layout), so it does not claim to check one.

  "3.0":
    status: current
    results_repo: https://github.com/mlcommons/submissions_storage_v3.0
    tool: mlpstorage 3.0.x
    layout_versions: [2, 3]
    workloads:
      closed:
        training:
          unet3d: [b200, mi355]
          retinanet: [b200, mi355]
        checkpointing:
          llama3-8b: [b200, mi355]
          llama3-70b: [b200, mi355]
          llama3-405b: [b200, mi355]
          llama3-1t: [b200, mi355]
        vector_database:
          milvus: []
        kv_cache:
          llama3.1-8b: []
      # Rules.md 2.1.11 / 2.1.21 name the same workloads in every division;
      # OPEN may vary parameters, not workloads. kv_cache / vector_database
      # mirror closed: the OPEN `--model` alternatives of 6.6.2 are CLI
      # allowances, not sanctioned workloads.
      open:
        training:
          unet3d: [b200, mi355]
          retinanet: [b200, mi355]
        checkpointing:
          llama3-8b: [b200, mi355]
          llama3-70b: [b200, mi355]
          llama3-405b: [b200, mi355]
          llama3-1t: [b200, mi355]
        vector_database:
          milvus: []
        kv_cache:
          llama3.1-8b: []
    # What `validate` requires of every leaf of this edition. The regexes are
    # the former submission_checker/constants.py dicts, byte for byte (the
    # frozen v3.0 tree validates identically); the folders are the DLIO
    # config directory (Rules.md 2.1.15 pins its three inner YAMLs).
    checker:
      # datagen runs DLIO with workflow.generate_data=True, workflow.train=False,
      # so it never writes *output.json / *per_epoch_stats.json / *summary.json
      # (issue #600); training_<ts>_metadata.json is the tool's own metadata.
      datagen_required_files:
        - 'training_datagen\.stdout\.log$'
        - 'training_datagen\.stderr\.log$'
        - 'dlio\.log$'
        - 'training_.*_metadata\.json$'
      datagen_required_folders: [dlio_config]
      run_required_files:
        - 'training_run\.stdout.log'
        - 'training_run\.stderr.log'
        - '.*output\.json'
        - '.*per_epoch_stats\.json'
        - '.*summary\.json'
        - 'dlio\.log'
      run_required_folders: [dlio_config]
      # checkpointing_run.* prefixes, escaped dots (Rules.md 2.1.25; BUG-02).
      checkpoint_required_files:
        - 'checkpointing_run\.stdout\.log'
        - 'checkpointing_run\.stderr\.log'
        - '.*output\.json'
        - '.*per_epoch_stats\.json'
        - '.*summary\.json'
        - 'dlio\.log'
      checkpoint_required_folders: [dlio_config]
      # Rules.md 3.3.2: minimum mean AU per training model, as the fraction
      # DLIO's `metric.au` carries (the shipped workload templates; the key is
      # in the training@1 core-config allowlist, so a template that changes it
      # also hashes outside every class). `validate` fails a run whose mean AU
      # is below it even when DLIO's own verdict says success.
      training_au_thresholds:
        unet3d: 0.90
        retinanet: 0.85
      # Rules.md Table 2 "Total Processes" (TP x PP x DP) per model: the
      # CLOSED count 4.6.1 requires (no subset form exists above 8B, 4.3.5).
      closed_mpi_processes:
        llama3-8b: 8
        llama3-70b: 64
        llama3-405b: 512
        llama3-1t: 1024
      # Rules.md Table 2 "Checkpoint size", GB — the runtime's 4.3.4 pre-flight
      # gate (`validate` uses the checkpoint_size_GB DLIO actually measured).
      # 1T is Table 2's 18 TB, kept for comparability with the rounds already
      # gated on it (the measured size is 15,427 GiB).
      checkpoint_size_gb:
        llama3-8b: 105
        llama3-70b: 912
        llama3-405b: 5290
        llama3-1t: 18000
      # Rules.md Table 3 simulated accelerator memory, GB (4.3.4); h100 / a100
      # are whatif-only in this edition but a leaf may still record them.
      accelerator_memory_gb:
        b200: 180
        mi355: 288
        h100: 80
        a100: 80
      # Rules.md 6.3.2.1 kvcacheClosedSequenceLocks: the values a CLOSED
      # kv_cache run is pinned to (the runtime hard-fails any override).
      kvcache_closed_sequence:
        seed: 42
        trials: 3
        inter_option_delay_s: 90
    # Every DLIO commit a sanctioned v3.0 CLOSED row ran on (walked from the
    # frozen tree's code images; 13 leaves whose image was built from a local
    # DLIO checkout record no commit and cannot be listed).
    dlio_revisions:
      - {commit: edaf4bb3d6343ef2fb6b9f6dbafa6102032ae8bf, source: https://github.com/mlcommons/DLIO_local_changes.git, version: "3.0.4"}
      - {commit: 24b13d7630a12e3d08624e5db254694a09f71599, source: https://github.com/mlcommons/DLIO_local_changes.git, version: "3.0.2"}
      - {commit: a7d56e73ed4630e47f89720436290a23c0f94b6c, source: https://github.com/mlcommons/DLIO_local_changes.git, version: "3.0.2"}
      - {commit: f6796ed281e39ccc83a450e2b1f21b9c909d8fd0, source: https://github.com/mlcommons/DLIO_local_changes.git, version: "3.0.2"}
      - {commit: 252a54b18d113541e1e8e24832921fac0a7f2b96, source: https://github.com/mlcommons/DLIO_local_changes.git, version: "3.0.2"}
      - {commit: 86945a7a203912435774e0972f6350221446229e, source: https://github.com/mlcommons/DLIO_local_changes.git, version: "3.0.2"}
      - {commit: c338e07412350df4d72279be985ff31b82407a80, source: https://github.com/mlcommons/DLIO_local_changes.git, version: "3.0.2"}
      - {commit: 95c6a9d46a2a072b7f1455b65b3a5e22602b53e5, source: https://github.com/mlcommons/DLIO_local_changes.git, version: "3.0.2"}
      - {commit: 17d982a3c7842355c25787c97f636a9f6a474caa, source: https://github.com/mlcommons/DLIO_local_changes.git, version: "3.0.2"}
      - {commit: 21c0723de897add728158943d369abd4b333f7dc, source: https://github.com/russfellows/dlio_benchmark.git, version: "3.0.2"}
    storage_libraries:
      s3dlio: ["0.9.106", "0.9.110", "0.9.112"]
    notes: >-
      Results repository frozen at b50de9cf0 (storage tag v3.0 @ ce28a98).
      Every 3.0.x tool release implements this edition.

