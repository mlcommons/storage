name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest" # Resolves to the latest stable version automatically

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-common

    - name: Install package and test dependencies
      run: uv sync # Automatically creates the environment and locks dependencies

    - name: Run unit tests
      run: uv run pytest # Runs your tests safely inside the managed environment

    - name: Run unit tests with coverage
      run: |
        uv run pytest tests/unit -v --cov=mlpstorage_py --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install lint dependencies
      run: |
        python -m pip install --upgrade pip
        uv pip install ruff

    - name: Run ruff check
      run: |
        ruff check mlpstorage_py/ --output-format=github || true

    - name: Run ruff format check
      run: |
        ruff format --check mlpstorage_py/ || true
