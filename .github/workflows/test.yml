name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        # Two parallel groups, balanced by measured wall-clock (2026-09-23):
        #   - kvcache (238 tests averaging 0.5s of allocation setup each) plus
        #     the four real-mpirun probe tests (a fixed ~10s quiesce window
        #     each, 35% of the main suite when run serially);
        #   - the main suite minus those four, then the package and vdb suites.
        # Every suite that has more than a few seconds of work runs under
        # pytest-xdist (`-n auto`: one worker per runner vCPU). Both heavy
        # suites were verified xdist-clean; the main suite drops from ~175s
        # serial to ~30s at four workers, kvcache from ~100s to ~40s.
        group:
          - name: kvcache
            commands: |
              uv run pytest kv_cache_benchmark/tests -n auto
              uv run pytest tests/integration/test_shared_fs_probe_real_mpi.py -n auto
          - name: others
            commands: |
              uv run pytest tests -n auto --ignore=tests/integration/test_shared_fs_probe_real_mpi.py
              uv run pytest mlpstorage_py/tests -n auto
              uv run pytest vdb_benchmark/tests
    name: test (${{ matrix.python-version }}, ${{ matrix.group.name }})

    steps:
    - uses: actions/checkout@v4

    # 1. Environment Setup
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest" # Resolves to the latest stable version automatically

#    # 2. Fast Lint Check (Fails fast if code style is wrong)
#    - name: Install lint dependencies
#      run: uv pip install --system ruff
#
#    - name: Run ruff check
#      run: ruff check
#
#    - name: Run ruff format check
#      run: ruff format --check

    # 3. System and Test Dependencies
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-common openmpi-bin 

    - name: Install package and test dependencies
      run: uv sync --extra test

    - name: Install subpackages (vdb_benchmark, kv_cache_benchmark)
      # These have their own pyproject.toml and tests; install editable so
      # their imports resolve and their `test` extras are available.
      run: |
        uv pip install -e ./vdb_benchmark
        uv pip install -e ./kv_cache_benchmark

    # 4. Run this group's test suites.
    # We can't collect all suites together: `tests/` and `vdb_benchmark/tests/`
    # both have a top-level package named `tests` whose conftest.py modules
    # collide under pytest's rootdir-relative import (ImportPathMismatchError).
    # Each suite's pyproject defines its own `slow` marker and `-m 'not slow'`
    # default, so subprocess-level invocation is correct. The real-mpirun file
    # is --ignore'd in `others` only because `kvcache` runs it explicitly:
    # every test still runs exactly once per workflow run.
    - name: Run ${{ matrix.group.name }} test suite(s)
      run: ${{ matrix.group.commands }}
